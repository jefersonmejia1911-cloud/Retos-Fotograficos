<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Retos Fotográficos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="viewport-wrapper">
    
    <!-- 1. FOTO DE FONDO DEL TALLER -->
    <img src="fondo-taller.jpg" alt="Fondo Taller" class="bg-image">

    <!-- 2. CAPA SUPERPUESTA CON RULETA Y BOTONES -->
    <div class="interface-overlay">
      
      <!-- RULETA UNIFICADA EN CANVAS -->
      <div class="canvas-overlay">
        <canvas id="ruletaCanvas"></canvas>
      </div>

      <!-- PLACA DE RESULTADO AMARILLA -->
      <div class="result-container">
        <img src="placa-amarilla.png" alt="Placa" class="placa-bg">
        <div class="result-text-box">
          <span id="textoReto">¡GIRA <br> LA RULETA!</span>
        </div>
      </div>

      <!-- GRUPO BOTÓN 1: GIRAR RULETA (Inicia Rojo) -->
      <div id="groupGirar" class="btn-group group-girar">
        <button id="btnGirar" class="btn-industrial">
          <img id="imgBtnGirar" src="btn-rojo.jpg" alt="Girar">
          <span>GIRAR RULETA</span>
        </button>
      </div>

      <!-- GRUPO BOTÓN 2: VER EJEMPLO (Rojo Fijo) -->
      <div id="groupEjemplo" class="btn-group group-ejemplo">
        <button id="btnEjemplo" class="btn-industrial">
          <img src="btn-rojo.jpg" alt="Ejemplo">
          <span>VER EJEMPLO</span>
        </button>
      </div>

      <!-- GRUPO BOTÓN 3: ENVIAR FOTO (Rojo Fijo) -->
      <div id="groupEnviar" class="btn-group group-enviar">
        <button id="btnEnviar" class="btn-industrial">
          <img src="btn-rojo.jpg" alt="Enviar">
          <span>ENVIAR FOTO</span>
        </button>
      </div>

    </div>

    <!-- MODAL 1: VER EJEMPLO -->
    <div id="modalEjemplo" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="tituloEjemplo">EJEMPLO DEL RETO</h3>
          <button class="close-modal-btn" onclick="cerrarModal('modalEjemplo')">&times;</button>
        </div>
        <div class="example-image-container">
          <img id="imgEjemplo" src="btn-rojo.jpg" alt="Ejemplo de foto">
        </div>
      </div>
    </div>

    <!-- MODAL 2: ENVIAR FOTO -->
    <div id="modalEnviar" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h3>ENVIAR TU FOTO</h3>
          <button class="close-modal-btn" onclick="cerrarModal('modalEnviar')">&times;</button>
        </div>
        <form id="formEnviar">
          <div class="form-group">
            <label for="inputNombre">Tu Nombre / Usuario:</label>
            <input type="text" id="inputNombre" class="custom-input" placeholder="@usuario" required>
          </div>
          <div class="form-group">
            <label for="inputFoto">Selecciona tu foto:</label>
            <input type="file" id="inputFoto" class="custom-input" accept="image/*" required>
          </div>
          <button type="submit" class="submit-btn">SUBIR FOTO</button>
        </form>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
